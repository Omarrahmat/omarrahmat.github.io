name: Build, test and publish
on:
  push:
    branches: [source]
  workflow_dispatch:
    inputs:
      browser_only:
        description: "Install only the test browser, without system packages (checks the fallback used when the package server is down)"
        type: boolean
        default: false
concurrency:
  group: publish
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://vbgustjtxjmjlgukzcfa.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_OLCpJFfc-ILt9acNMdfb_Q_wL4yjqSS
    steps:
      - uses: actions/checkout@v4
        with:
          ref: source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build tools
        env:
          BROWSER_ONLY: ${{ inputs.browser_only }}
        run: |
          # Downloads are tried more than once, because the package servers are sometimes unreachable from
          # GitHub's machines. On 11 Nov 2026 Ubuntu's package server could not be reached for two and a half
          # hours and six publishes failed at this step.
          retry() { local n=$1; shift; for i in $(seq 1 "$n"); do "$@" && return 0; echo "Attempt $i of $n failed: $*"; sleep $((i * 15)); done; return 1; }
          retry 4 npm install --no-save --no-audit --no-fund react@19.2.0 react-dom@19.2.0 esbuild@0.25.0 playwright@1.48.2
          # The test browser, with the system packages it likes to have (one attempt: when the package server is
          # down it takes ten minutes to give up). If that fails, fetch the browser on its own and carry on as
          # long as it starts: GitHub's machines already hold the libraries it needs, so a package-server outage
          # no longer stops the site being published.
          if [ "$BROWSER_ONLY" != "true" ] && npx playwright install --with-deps chromium; then
            echo "Browser and system packages installed."
          else
            echo "Installing the browser without system packages."
            retry 4 npx playwright install chromium
            node -e "require('playwright').chromium.launch().then((b) => b.close()).then(() => console.log('The browser starts.'))"
          fi
      - name: Merge data
        run: |
          node scripts/merge-data.mjs
          node scripts/merge-news.mjs
          node scripts/merge-guides.mjs
          node scripts/merge-allowances.mjs
          node scripts/merge-areas.mjs
      - name: Build
        run: node scripts/build-static.mjs
      - name: Browser tests
        run: node scripts/e2e.mjs
      - name: Portal tests
        run: node scripts/e2e-portal.mjs
      - name: Deploy to main
        run: |
          git config user.name "Fostering Today desk"
          git config user.email "hello@fosteringtoday.com"
          MSG="$(git log -1 --pretty=%s)"
          git fetch --depth 1 origin main
          rm -rf /tmp/pages && git worktree add /tmp/pages origin/main
          cd /tmp/pages
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .nojekyll -exec rm -rf {} +
          cp -a "$GITHUB_WORKSPACE/out/." .
          git add -A
          if git commit -q -m "$MSG"; then git push origin HEAD:main; echo "PUBLISHED $(git rev-parse --short HEAD)"; else echo "NO SITE CHANGES"; fi
